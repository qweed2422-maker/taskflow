{% extends "base.html" %}

{% block title %}Удалить задачу{% endblock %}

{% block content %}
  <h1 class="mb-4">Удалить задачу?</h1>
  <p>Вы уверены, что хотите удалить задачу «{{ object.title }}»? Все комментарии к ней также будут удалены.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'tasks:detail' object.pk %}" class="btn btn-link">Отмена</a>
  </form>
{% endblock %}
