{% extends "base.html" %}

{% block title %}Удалить проект{% endblock %}

{% block content %}
  <h1 class="mb-4">Удалить проект?</h1>
  <p>Вы уверены, что хотите удалить проект «{{ project.title }}»? Все связанные задачи также будут удалены.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'projects:detail' project.pk %}" class="btn btn-link">Отмена</a>
  </form>
{% endblock %}
