{% extends "base.html" %}

{% block title %}{{ project.title }}{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-start mb-3">
    <h1>{{ project.title }}</h1>
    {% if is_manager %}
      <div>
        <a href="{% url 'projects:edit' project.pk %}" class="btn btn-outline-secondary btn-sm">Редактировать</a>
        <a href="{% url 'projects:delete' project.pk %}" class="btn btn-outline-danger btn-sm">Удалить</a>
      </div>
    {% endif %}
  </div>

  <p>{{ project.description|linebreaks }}</p>

  <a href="{% url 'projects:list' %}" class="btn btn-link ps-0">&larr; Ко всем проектам</a>
{% endblock %}
